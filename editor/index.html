<style>
/* Layout: one working column on phones (sticky card preview over its fields, action bar pinned to the bottom);
   on wide screens the preview sits left and the fields right. Palette follows the base605 catalog: paper, holly red, pine green. */
:root{
  --paper:#FFF8F4; --dot:rgba(200,16,46,.10); --surface:#FFFFFF; --sunk:#F6EEE9;
  --ink:#2A1C1E; --muted:#7A6A6C; --line:#EADCD6;
  --red:#C8102E; --red-ink:#FFFFFF; --red-soft:#FBE3E6;
  --pine:#1E6B3A; --pine-soft:#E2F1E7; --amber:#9A5B00; --amber-soft:#FBEBD2;
  --focus:#1F5FD1; --shadow:0 1px 2px rgba(60,20,20,.10),0 8px 24px -12px rgba(60,20,20,.28);
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151917; --dot:rgba(255,120,130,.07); --surface:#1E2421; --sunk:#252C29;
  --ink:#F3ECE8; --muted:#A79C98; --line:#333B37;
  --red:#FF5E6E; --red-ink:#1A0B0D; --red-soft:#3A1E22;
  --pine:#6FCF97; --pine-soft:#1F3328; --amber:#F2B14C; --amber-soft:#3A2D17;
  --focus:#8AB4FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151917; --dot:rgba(255,120,130,.07); --surface:#1E2421; --sunk:#252C29;
  --ink:#F3ECE8; --muted:#A79C98; --line:#333B37;
  --red:#FF5E6E; --red-ink:#1A0B0D; --red-soft:#3A1E22;
  --pine:#6FCF97; --pine-soft:#1F3328; --amber:#F2B14C; --amber-soft:#3A2D17;
  --focus:#8AB4FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.stripe{height:6px;background:repeating-linear-gradient(135deg,var(--red) 0 14px,var(--surface) 14px 20px,var(--pine) 20px 34px,var(--surface) 34px 40px)}
.topin{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--red);font-size:18px;letter-spacing:-.01em;margin-right:auto}
.brand small{color:var(--muted);font-weight:500;font-size:14px;letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--red);color:var(--red-ink);font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}

/* catalog */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px 6px}
.seg{display:flex;gap:3px;background:var(--sunk);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.search{flex:1 1 140px;min-width:0;max-width:240px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:14px;text-transform:uppercase}
.search::placeholder{text-transform:none;color:var(--muted)}
.tier{padding-block:18px 8px}
.tier h2{margin:0;font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.tier h2 .price{color:var(--red)}
.tier p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tier .rule{height:2px;background:var(--red);margin-top:10px;border-radius:2px;opacity:.85}
.shape{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--pine);text-transform:uppercase;margin:16px 0 8px}
.grid{display:grid;gap:14px 12px}
.grid.L{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.P{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
.tile{border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tile img{width:100%;height:auto;display:block;background:#fff;border-radius:4px;box-shadow:var(--shadow);transition:transform .15s}
.tile:hover img{transform:translateY(-2px)}
.tile span{font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.02em}
.empty{color:var(--muted);padding:24px 0}

/* editor */
.ed{display:grid;grid-template-columns:1fr;gap:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.edhead{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.code{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--red-soft);color:var(--red)}
.pill.g{background:var(--pine-soft);color:var(--pine)}
.saved{margin-left:auto;font-size:13px;color:var(--muted)}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,64px));z-index:5;background:var(--paper);padding-block:6px 10px;display:flex;justify-content:center}
.stage .frame{position:relative;line-height:0}
.stage{min-width:0}
.stage canvas{max-width:100%;display:block;border-radius:3px;box-shadow:var(--shadow);background:#fff;touch-action:manipulation;cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:-2px 0 8px}
.loading{position:absolute;left:8px;bottom:8px;font:600 11px var(--ui);background:var(--surface);color:var(--muted);border-radius:6px;padding:3px 7px;line-height:1.4;box-shadow:var(--shadow)}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0;padding-block:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input.t,textarea.t{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 11px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.t{resize:vertical;line-height:1.35;min-height:44px}
.field{display:flex;flex-direction:column;gap:7px}
.field.flash textarea,.field.flash input{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.fhead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.fhead b{color:var(--ink)}
.fit{font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:1px 7px}
.ctrls{display:flex;align-items:center;gap:6px;margin-left:auto}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:32px;height:32px;padding:0 8px;cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.ib:disabled{opacity:.4;cursor:default}
.pct{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:38px;text-align:center}
.runs{display:grid;grid-template-columns:minmax(70px,.4fr) 1fr;gap:8px}
details.other summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
details.other summary::before{content:"▸ ";}
details.other[open] summary::before{content:"▾ ";}
.lockrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font-size:14px;padding-top:10px}
.lockrow .txt{white-space:pre-wrap;color:var(--ink);min-width:0}
.lockrow .lab{display:block;font-size:12px;color:var(--muted);font-weight:600}
.link{border:0;background:none;color:var(--red);font-weight:600;cursor:pointer;padding:4px 2px;font-size:13px;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:0}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.actin{display:flex;gap:8px}
.btn{flex:1;border-radius:10px;padding:11px 10px;font-weight:700;font-size:14.5px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.pine{background:var(--pine);border-color:var(--pine);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}

/* drafts */
/* orders (connected to the order app) */
.ogrid{display:grid;gap:18px;padding-block:8px 40px}
@media (min-width:900px){.ogrid{grid-template-columns:1fr 1fr}}
.ogrp h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gc,var(--muted))}
.orow{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;font:inherit;color:var(--ink)}
.orow:hover{border-color:var(--gc,var(--line))}
.orow b{font-size:15px}.orow i{font-style:normal;color:var(--muted)}
.orow .rt{font-size:12.5px;color:var(--muted);text-align:right}
.orow .chips{display:flex;gap:5px;flex-wrap:wrap}
.orow .chips span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.orow .sub{font-size:12px;color:var(--muted);text-align:right}
.orow .cn{grid-column:1/-1;font-size:12.5px;color:var(--red);font-weight:600}
.obox{border-color:var(--pine)}
.obox .oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.obox .oh b{font-size:16px}.obox .oh span{font-size:12px;color:var(--muted)}
.obox .cnb{background:var(--red-soft);color:var(--red);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.olist{display:flex;flex-direction:column;gap:4px}
.olist button{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:7px 8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.olist button[aria-current="true"]{background:var(--pine-soft)}
.olist .n{width:22px;height:22px;flex:0 0 22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:var(--muted)}
.olist button[aria-current="true"] .n{background:var(--pine);border-color:var(--pine);color:#fff}
.olist .n.ok{background:var(--pine-soft);border-color:var(--pine);color:var(--pine)}
.olist .tx{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.olist .tx em{font-style:normal;color:var(--muted)}
.olist .up{font-size:10.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:1px 7px}
.obtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.obtns .wide{grid-column:1/-1}
.obtns .btn{flex:none}
.ochg{display:flex;gap:6px}.ochg input{flex:1}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px 4px}
.dhead h2{margin:0 auto 0 0;font-size:26px;letter-spacing:-.02em}
.dlist{display:flex;flex-direction:column;gap:10px;padding-block:8px 40px}
.drow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.drow .th{width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--sunk);border-radius:8px;cursor:pointer;border:0;padding:4px}
.drow .th img{max-width:100%;max-height:100%;border-radius:2px;box-shadow:var(--shadow)}
.drow .who{min-width:0;cursor:pointer}
.drow .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .who span{font-size:13px;color:var(--muted)}
.dside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.status{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.st-draft{background:var(--sunk);color:var(--muted)}
.st-sent{background:var(--amber-soft);color:var(--amber)}
.st-approved{background:var(--pine-soft);color:var(--pine)}
.st-printed{background:var(--red-soft);color:var(--red)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);
  padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.modal .in{background:var(--surface);border-radius:var(--r);padding:16px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.modal img{width:100%;height:auto;border-radius:4px}

@media (min-width:900px){
  .ed{grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:28px;align-items:start}
  .edhead{grid-column:1/-1}
  .stage{grid-column:1;grid-row:2}
  .hint{grid-column:1;grid-row:3;align-self:start}
  .ed>.panel{grid-column:2;grid-row:2/span 2}
  .stage{top:calc(env(safe-area-inset-top,0px) + var(--hh,64px) + 12px)}
}
@media (max-width:430px){.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">

<script>/* base605 tag renderer: draws a card (background art + live text) onto a canvas.
   Shared by the editor page and the verification harness. */
(function (g) {
  "use strict";
  var FALLBACK = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  if(!known.length){toast(missing.length?"Design "+missing.map(function(x){return x.code}).join(", ")+" isn't in the tag editor.":"This order has no tag design code.");return Promise.resolve([])}
  var oid=safeId(o.id||o.no||Date.now());

    var id="o"+oid+"-"+it.ix;

      :Promise.resolve(lsGet().filter(function(d){return d.id===id})[0]||null);
    return look.then(function(existing){

/* ---------- orders from the order app ---------- */
var ORDERS=[],ordersLoaded=false,octx=null; // octx: {order, ids:[draft ids in item order], seen:{}}

function linkOrder(o){return{id:o.id,no:o.no,cu:o.customer||"",items:codeItems(o).map(function(i){return{c:i.code,n:i.sender||"",g:i.greeting||"",q:i.pieces||null}})}}

    {k:"chg",t:"Changes requested",c:"var(--red)",f:function(o){return !!o.changeNote&&!stageAtLeast(o,"approved")}},

    var sec=document.createElement("div");sec.className="ogrp";sec.style.setProperty("--gc",g.c);
    sec.innerHTML="<h4>"+g.t+" · "+list.length+"</h4>";

function openOrder(o){

function draftById(id){return drafts.filter(function(d){return d.id===id})[0]||null}

document.addEventListener("click",function(e){

function flushIfDirty(){if(cur&&cur.dirty&&cur.draftId)flushSave()}

/* ---------- proof sheet: every tag of the order on one long image ---------- */
function cardCanvas(d){var card=CARDS[d.code],st={layers:d.layers||{}};
  return Promise.all([loadBg(d.code),ensureFonts(card,allText(card,st))]).then(function(r){var c=document.createElement("canvas");TagRender.render(c,card,st,r[0],{mode:"card",scale:1});watermark(c);return c})}
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}

function makeProof(){
  if(!octx)return;flushIfDirty();var o=octx.order,ci=codeItems(o);
  var ds=octx.ids.map(draftById);if(ds.some(function(d){return !d})){toast("Still saving. Try again in a moment.");return}

  Promise.all(ds.map(cardCanvas)).then(function(cs){
    var W=1080,M=48,G=24,CW=(W-2*M-G)/2,CAP=84,MAXH=430,HEAD=156,FOOT=64;
    var cells=cs.map(function(c,i){var s=Math.min(CW/c.width,MAXH/c.height);return{c:c,w:Math.round(c.width*s),h:Math.round(c.height*s),d:ds[i],it:ci[i]||{}}});
    var rows=[];for(var i=0;i<cells.length;i+=2)rows.push(cells.slice(i,i+2));

    x.fillStyle="#922b2c";x.fillRect(0,0,W,HEAD-6);x.fillStyle="#f9a75d";x.fillRect(0,HEAD-6,W,6);
    var F="Inter, -apple-system, system-ui, sans-serif";
    x.fillStyle="#f9a75d";x.font="700 20px "+F;x.textAlign="left";x.fillText("DRAFT FOR APPROVAL",M,52);
    x.fillStyle="#fff";x.font="700 44px "+F;x.fillText(fit(x,o.customer||"",W-2*M-260),M,108);
    x.textAlign="right";x.font="700 34px "+F;x.fillText("#"+pad4(o.no),W-M,64);
    var tags=ci.reduce(function(a,i){return a+(Number(i.pieces)||0)},0);x.fillStyle="#f9a75d";x.font="600 20px "+F;x.fillText(ci.length+" design"+(ci.length===1?"":"s")+(tags?" · "+tags+" tags":""),W-M,102);
    var y=HEAD+28;
    rows.forEach(function(r,ri){
      r.forEach(function(cl,j){var X=M+j*(CW+G),Y=y,idx=ri*2+j,h=rowH[ri];
        x.fillStyle="#fff";rr(x,X,Y,CW,h,16);x.fill();x.strokeStyle="#ECE6DC";x.lineWidth=2;x.stroke();
        var ix=X+(CW-cl.w)/2,iy=Y+12;x.save();rr(x,ix,iy,cl.w,cl.h,8);x.clip();x.drawImage(cl.c,ix,iy,cl.w,cl.h);x.restore();
        x.fillStyle="#24201c";x.beginPath();x.arc(X+22,Y+22,17,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.font="700 18px "+F;x.textAlign="center";x.fillText(String(idx+1),X+22,Y+28);
        var up=cl.d.proofAt&&(cl.d.updatedAt||0)>cl.d.proofAt+1500;
        if(up){x.font="700 15px "+F;var tw=x.measureText("UPDATED").width+20;x.fillStyle="#fbebd2";rr(x,X+CW-tw-12,Y+12,tw,26,13);x.fill();x.fillStyle="#9a5b00";x.fillText("UPDATED",X+CW-12-tw/2,Y+31)}
        var cy=Y+12+Math.max.apply(null,r.map(function(q){return q.h}))+30,card=CARDS[cl.d.code];
        x.textAlign="left";x.fillStyle="#24201c";x.font="700 22px "+F;x.fillText(cl.d.code,X+16,cy);
        x.textAlign="right";x.fillStyle="#75706a";x.font="500 17px "+F;x.fillText((TIERS[card.tier]?TIERS[card.tier].name:"")+(cl.it.pieces?" · "+cl.it.pieces+" pcs":""),X+CW-16,cy);
        var nm=nameGuess(cl.d)||cl.it.sender||"",g=cl.it.greeting||"";x.textAlign="left";x.font="500 17px "+F;
        x.fillText(fit(x,(nm?"Name: "+nm:"")+(g?(nm?" · ":"")+"“"+g+"”":""),CW-32),X+16,cy+28)});
      if(r.length===1){var X2=M+CW+G,Y2=y,h2=rowH[ri];drawNote(x,X2,Y2,CW,h2,F)}
      y+=rowH[ri]+G});
    if(!odd){drawNote(x,M,y,W-2*M,noteH,F);y+=noteH+G}
    x.fillStyle="#ECE6DC";x.fillRect(M,H-FOOT,W-2*M,2);x.fillStyle="#75706a";x.font="500 17px "+F;x.textAlign="left";x.fillText("base605 · draft preview, colors may vary slightly in print",M,H-FOOT+38);
    if(o.releaseDate){x.textAlign="right";x.fillText("release "+fmtD(o.releaseDate),W-M,H-FOOT+38)}
    return blobOf(cv2)}).then(function(b){
      var first=String(o.customer||"").replace(/^@/,"").trim().split(/\s+/)[0].replace(/[^\w-]+/g,"")||"order";
      return offer(pad4(o.no)+"_"+first+"_proof.png",b)}).then(function(){
      var now=Date.now();octx.ids.forEach(function(id){patchDraft(id,{status:"sent",proofAt:now})});
      var f={changeNote:""};if(!stageAtLeast(o,"for approval")||o.status==="drafted"||o.status==="new"){f.status="for approval";f.stageAt=new Date().toISOString()}
      patchOrder(o,f);renderOrderBox()}).catch(function(e){console.error(e);toast("Couldn't make the proof sheet. Try again.")});
}
function drawNote(x,X,Y,W,H,F){var g=x.createLinearGradient(X,Y,X+W,Y+H);g.addColorStop(0,"#2f5d44");g.addColorStop(1,"#244a36");x.fillStyle=g;rr(x,X,Y,W,H,16);x.fill();

  ls.slice(0,4).forEach(function(l,i){x.fillText(l,X+24,Y+84+i*28)})}
function orderPrintFiles(){
  if(!octx)return;flushIfDirty();var o=octx.order,ds=octx.ids.map(draftById).filter(Boolean);if(!ds.length)return;
  if(!window.JSZip){toast("Zip tools didn't load. Use Print file on each tag.");return}

    var d=ds[i++];renderFile(d.code,{layers:d.layers||{}},"print").then(function(b){var base=pad4(o.no)+"_"+d.code,fn=base,k=2;while(used[fn])fn=base+" ("+(k++)+")";used[fn]=1;zip.file(fn+".png",b)}).then(next,next)})();

/* ---------- boot ---------- */
renderCat();setHH();show(SCRIPT_URL?"or":"cat");
var ordersP=pullOrders();setInterval(function(){if(!document.hidden&&view==="or")pullOrders()},30000);
dbP.then(function(d){
  db=d;
  if(!db){useLocal=true;drafts=lsGet();$("storeNote").textContent="Couldn't reach the order app, so drafts are saved in this browser only for now.";renderDrafts();return}

  db.collection("drafts").orderBy("updatedAt","desc").limit(500).onSnapshot(function(s){

    function(){useLocal=true;drafts=lsGet();$("storeNote").textContent="Sync isn't available right now, so drafts are saved in this browser only.";renderDrafts()});
}).then(function(){return ordersP}).then(importFromHash);
})();
